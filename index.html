<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYTE: Brecha en la Nube</title>
<style>
  :root { --cy: #3fc1ff; --mg: #ff2e88; --yl: #ffb703; --gr: #39ff88; --bg: #03040a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,46,136,.28) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(63,193,255,.25) 0%, transparent 55%),
      var(--bg);
    color: #e8ecf8; font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
  }
  body::before {
    content: ""; position: fixed; left: -50%; right: -50%; bottom: -30%; height: 70%; z-index: -1;
    background-image: linear-gradient(rgba(255,46,136,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(63,193,255,.25) 1px, transparent 1px);
    background-size: 46px 46px; transform: perspective(380px) rotateX(62deg); animation: grid 2.4s linear infinite;
    mask-image: linear-gradient(to top, #000 30%, transparent 100%); -webkit-mask-image: linear-gradient(to top, #000 30%, transparent 100%);
  }
  @keyframes grid { to { background-position: 0 46px; } }
  .wrap {
    position: relative; width: min(97vw, 150vh); aspect-ratio: 480 / 300; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(63,193,255,.55), 0 0 0 4px rgba(10,14,30,.9), 0 0 0 5px rgba(255,46,136,.45), 0 0 45px rgba(63,193,255,.35), 0 0 110px rgba(255,46,136,.22);
  }
  .wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.55) 100%);
    mix-blend-mode: multiply;
  }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; cursor: crosshair; }
  #ov {
    position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .7rem; text-align: center; padding: 1.1rem 1.4rem; overflow: auto;
    background: radial-gradient(ellipse at 50% 40%, rgba(25,8,45,.62), rgba(3,4,10,.93)); animation: fadeIn .3s ease-out;
  }
  #ov.full { justify-content: flex-start; background: rgba(3,4,10,.95); }
  #ov.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(1.02); } }
  .logo {
    position: relative; font-family: "Arial Black", Impact, sans-serif; font-weight: 900; font-size: clamp(2.4rem, 9vw, 5.6rem);
    line-height: .95; letter-spacing: .14em; color: #fff; text-shadow: 0 0 6px #fff, 0 0 18px var(--cy), 0 0 42px var(--cy); animation: flicker 5s infinite;
  }
  .logo.red { text-shadow: 0 0 6px #fff, 0 0 18px var(--mg), 0 0 42px var(--mg); font-size: clamp(1.6rem, 6vw, 3.6rem); }
  .logo.gold { text-shadow: 0 0 6px #fff, 0 0 18px var(--yl), 0 0 42px var(--yl); font-size: clamp(1.8rem, 6.5vw, 4rem); }
  .logo::before, .logo::after { content: attr(data-t); position: absolute; inset: 0; pointer-events: none; }
  .logo::before { color: var(--mg); clip-path: inset(0 0 58% 0); animation: g1 2.7s infinite steps(1); }
  .logo::after { color: var(--cy); clip-path: inset(52% 0 0 0); animation: g2 3.3s infinite steps(1); }
  @keyframes g1 { 0%, 88%, 100% { transform: none; opacity: 0; } 89% { transform: translate(-6px,-1px); opacity: .9; } 92% { transform: translate(5px,1px); opacity: .9; } 95% { transform: translate(-2px,0); opacity: .9; } }
  @keyframes g2 { 0%, 80%, 100% { transform: none; opacity: 0; } 81% { transform: translate(6px,1px); opacity: .9; } 85% { transform: translate(-4px,0); opacity: .9; } }
  @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: .55; } 98% { opacity: 1; } 99% { opacity: .7; } }
  .tag { font-family: monospace; letter-spacing: .5em; color: var(--mg); font-size: clamp(.65rem, 1.6vw, .95rem); text-shadow: 0 0 10px var(--mg); }
  .story { color: #c3cbe6; max-width: 600px; font-size: clamp(.72rem, 1.6vw, .95rem); line-height: 1.5; }
  .story b { color: var(--yl); }
  .sub { color: #8f9bc4; font-family: monospace; letter-spacing: .2em; font-size: clamp(.65rem, 1.4vw, .85rem); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .7rem; width: min(640px, 100%); }
  .card {
    --c: var(--cy); position: relative; cursor: pointer; text-align: left; font-family: inherit; color: #e8ecf8; padding: .7rem .8rem;
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, transparent), rgba(5,8,20,.6));
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: transform .15s, background .15s;
  }
  .card:hover { transform: translateY(-3px); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 40%, transparent), rgba(5,8,20,.6)); }
  .card.e { --c: var(--gr); } .card.n { --c: var(--yl); } .card.h { --c: var(--mg); }
  .card b { display: block; font-family: monospace; letter-spacing: .15em; color: var(--c); font-size: clamp(.8rem, 1.8vw, 1.05rem); text-shadow: 0 0 8px var(--c); }
  .card small { display: block; color: #aeb8d8; font-size: clamp(.62rem, 1.3vw, .78rem); margin-top: .2rem; line-height: 1.35; }
  .card .lvl { position: absolute; top: .45rem; right: .6rem; font-family: monospace; font-size: .7rem; color: var(--c); }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem .9rem; font-size: clamp(.6rem, 1.3vw, .78rem); color: #8f9bc4; max-width: 660px; }
  kbd { display: inline-block; min-width: 1.5em; text-align: center; padding: 0 .35em; margin-right: .2em; border: 1px solid rgba(63,193,255,.5); border-bottom-width: 2px; border-radius: 4px; background: rgba(63,193,255,.1); color: #e8ecf8; font-family: monospace; font-size: .95em; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; align-items: center; }
  .menu { display: flex; flex-direction: column; gap: .5rem; width: min(330px, 100%); }
  .btn {
    --c: var(--yl); cursor: pointer; font-family: monospace; font-weight: 800; letter-spacing: .15em; font-size: clamp(.72rem, 1.6vw, .95rem);
    padding: .7rem 1.3rem; color: #05070f; background: var(--c); border: 0;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    box-shadow: 0 0 22px color-mix(in srgb, var(--c) 60%, transparent); transition: transform .12s, filter .12s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.15); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.alt { --c: var(--cy); } .btn.pink { --c: var(--mg); }
  .btn.ghost { color: #e8ecf8; background: rgba(255,255,255,.08); outline: 1px solid rgba(255,255,255,.25); box-shadow: none; }
  .btn.sm { padding: .4rem .7rem; font-size: .7rem; letter-spacing: .1em; }
  .link { background: none; border: 0; color: #6b7699; font-family: monospace; font-size: .7rem; cursor: pointer; text-decoration: underline; }
  .bits { display: inline-flex; align-items: center; gap: .4em; font-family: monospace; font-weight: 800; color: var(--yl); text-shadow: 0 0 8px rgba(255,183,3,.6); font-size: clamp(.8rem, 1.8vw, 1.05rem); }
  .hex { width: .95em; height: 1.05em; background: linear-gradient(var(--yl), #ff7a1a); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: inline-block; box-shadow: 0 0 8px var(--yl); }
  .stats { width: min(440px, 100%); display: flex; flex-direction: column; gap: .4rem; font-family: monospace; font-size: clamp(.7rem, 1.6vw, .9rem); }
  .stat { display: grid; grid-template-columns: 10em 1fr 4.5em; align-items: center; gap: .6rem; text-align: left; color: #aeb8d8; }
  .stat b { color: var(--yl); text-align: right; text-shadow: 0 0 8px rgba(255,183,3,.6); }
  .bar { height: 8px; background: rgba(255,255,255,.08); clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
  .bar i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--mg), var(--yl)); animation: grow 1.3s cubic-bezier(.2,.8,.2,1); }
  @keyframes grow { from { width: 0; } }
  /* ---------- Tienda ---------- */
  .shop { width: 100%; display: flex; flex-direction: column; gap: .6rem; }
  .shop-head { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .shop-head h2 { font-family: "Arial Black", Impact, sans-serif; letter-spacing: .12em; color: #fff; text-shadow: 0 0 14px var(--mg), 0 0 30px var(--mg); font-size: clamp(1rem, 3vw, 1.8rem); }
  .tabs { display: flex; gap: .35rem; flex-wrap: wrap; }
  .tab { cursor: pointer; font-family: monospace; font-weight: 700; letter-spacing: .12em; font-size: .72rem; padding: .45rem .8rem; color: #aeb8d8; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15); }
  .tab.on { color: #05070f; background: var(--cy); border-color: var(--cy); box-shadow: 0 0 14px rgba(63,193,255,.6); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: .6rem; text-align: left; }
  .item {
    --c: var(--cy); display: flex; flex-direction: column; gap: .3rem; padding: .7rem; min-height: 9.5rem;
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, transparent), rgba(5,8,20,.75));
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .item.own { --c: var(--gr); } .item.excl { --c: var(--mg); }
  .item h4 { font-family: monospace; letter-spacing: .1em; color: var(--c); font-size: .82rem; text-shadow: 0 0 8px var(--c); }
  .item p { font-size: .7rem; color: #aeb8d8; flex: 1; line-height: 1.35; }
  .item .tagx { font-family: monospace; font-size: .58rem; letter-spacing: .15em; color: var(--mg); }
  .item .st { font-family: monospace; font-size: .64rem; color: #8f9bc4; line-height: 1.5; }
  .item .st b { color: #e8ecf8; }
  .pips { display: flex; gap: 3px; } .pip { width: 14px; height: 5px; background: rgba(255,255,255,.12); } .pip.on { background: var(--c); box-shadow: 0 0 6px var(--c); }
  .skinprev { width: 48px; height: 42px; background: var(--b); border-bottom: 6px solid var(--d); border-radius: 6px; position: relative; margin: .15rem 0; box-shadow: 0 0 14px var(--b); }
  .skinprev::before { content: ""; position: absolute; left: 7px; right: 7px; top: 9px; height: 13px; background: var(--v); border-radius: 2px; }
  .skinprev::after { content: ""; position: absolute; top: 12px; left: 14px; width: 5px; height: 7px; background: #39ff88; box-shadow: 15px 0 0 #39ff88; }
  .skinprev.anim { background: linear-gradient(90deg, #ff2e88, #3fc1ff, #39ff88, #ffb703); animation: hue 1.5s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  .wimg { width: 100%; max-width: 170px; height: auto; image-rendering: pixelated; filter: drop-shadow(0 0 6px rgba(63,193,255,.35)); align-self: center; }
  .wprev { display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; padding: .6rem; border: 1px solid rgba(63,193,255,.25); background: radial-gradient(ellipse at center, rgba(63,193,255,.12), transparent 70%); }
  .wprev img { width: min(340px, 70vw); image-rendering: pixelated; filter: drop-shadow(0 0 14px rgba(63,193,255,.55)); }
  .wprev .sub { text-align: left; }
  .chips { display: flex; gap: .35rem; flex-wrap: wrap; }
  .chip { cursor: pointer; display: flex; align-items: center; gap: .3rem; padding: .25rem .5rem; font-family: monospace; font-size: .62rem; letter-spacing: .08em; color: #aeb8d8; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15); }
  .chip img { height: 14px; image-rendering: pixelated; }
  .chip.on { color: #05070f; background: var(--yl); border-color: var(--yl); }
  .loadout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
  .slot { cursor: pointer; display: flex; flex-direction: column; gap: .3rem; align-items: center; padding: .6rem .4rem; min-height: 7rem; text-align: center;
    border: 1px dashed rgba(255,255,255,.25); background: rgba(255,255,255,.03); font-family: monospace; color: #aeb8d8; font-size: .7rem; }
  .slot.full { border-style: solid; border-color: rgba(63,193,255,.5); }
  .slot.sel { border-color: var(--yl); box-shadow: 0 0 16px rgba(255,183,3,.45); background: rgba(255,183,3,.08); }
  .slot b { color: var(--yl); letter-spacing: .15em; }
  .hint { font-family: monospace; font-size: .7rem; color: #8f9bc4; text-align: left; }
  .audio { display: flex; align-items: center; gap: .6rem; }
  .audio input[type=range] { width: 150px; accent-color: var(--mg); cursor: pointer; }
  .foot { margin-top: .9rem; font-size: .78rem; color: #6b7699; font-family: monospace; letter-spacing: .08em; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <canvas id="c" width="480" height="300"></canvas>
    <div id="ov"></div>
  </div>
  <p class="foot">Haz clic en el juego para capturar el ratón · <kbd>Esc</kbd> pausa · Recomendado con teclado y ratón</p>

<script>
(() => {
"use strict";
// =====================================================================
//  CONFIGURACIÓN Y UTILIDADES
// =====================================================================
const RW = 480, RH = 300, VH = 300, TS = 64, CAMPAIGN = 10;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const ov = document.getElementById("ov");
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
let seed = 1;
const srnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h, fn) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); fn(g, w, h); return c; }

const DIFFS = {
  facil:   { name: "Recluta",   dmg: 0.55, ehp: 0.8 },
  normal:  { name: "Operador",  dmg: 1.0,  ehp: 1.0 },
  dificil: { name: "Pesadilla", dmg: 1.5,  ehp: 1.25 },
};
let diff = DIFFS.normal;

// =====================================================================
//  PERFIL PERSISTENTE (bits, mejoras, skins, armas de tienda, partida)
// =====================================================================
const PKEY = "byte.profile.v2";
const defProfile = () => ({ bits: 0, up: {}, skins: ["clasico"], skin: "clasico", shopW: [], best: 0, run: null, wskins: ["estandar"], wskinOf: {}, music: { vol: .55, on: true } });
function loadProfile() { try { const p = JSON.parse(localStorage.getItem(PKEY)); if (p) return Object.assign(defProfile(), p); } catch (e) {} return defProfile(); }
let profile = loadProfile();
function saveProfile() { try { localStorage.setItem(PKEY, JSON.stringify(profile)); } catch (e) {} }
const upg = k => profile.up[k] || 0;

const UPGRADES = [
  { id: "hp",     name: "CHASIS REFORZADO",     desc: "+20 de integridad máxima por nivel.", max: 3, cost: [250, 500, 900] },
  { id: "armor",  name: "FIREWALL INICIAL",     desc: "Empiezas cada sector con +25 de blindaje por nivel.", max: 3, cost: [200, 420, 800] },
  { id: "dmg",    name: "OVERCLOCK DE DAÑO",    desc: "+10% de daño con todas las armas por nivel.", max: 5, cost: [300, 550, 850, 1250, 1800] },
  { id: "reload", name: "SERVOS RÁPIDOS",       desc: "Recargas un 15% más rápido por nivel.", max: 3, cost: [220, 450, 800] },
  { id: "mag",    name: "CARGADORES AMPLIADOS", desc: "+25% de capacidad de cargador por nivel.", max: 3, cost: [260, 520, 900] },
  { id: "regen",  name: "NANOREPARACIÓN",       desc: "Regeneras 1 s antes y +3 puntos/s más rápido por nivel.", max: 3, cost: [300, 600, 1000] },
  { id: "speed",  name: "ACTUADORES",           desc: "+8% de velocidad de movimiento por nivel.", max: 3, cost: [200, 400, 700] },
  { id: "magnet", name: "IMÁN DE BITS",         desc: "Atraes el botín desde más lejos.", max: 2, cost: [150, 400] },
  { id: "loot",   name: "MINERÍA DE DATOS",     desc: "+15% de bits por cada enemigo por nivel.", max: 3, cost: [350, 700, 1200] },
];
const maxHealth = () => 100 + 20 * upg("hp");
const dmgMul = () => 1 + .1 * upg("dmg");
const reloadMul = () => 1 - .15 * upg("reload");
const regenDelay = () => 4.5 - upg("regen");
const regenRate = () => 6 + 3 * upg("regen");
const moveMul = () => 1 + .08 * upg("speed");
const magnetR = () => 1.3 + 1.4 * upg("magnet");
const lootMul = () => 1 + .15 * upg("loot");

const SKINS = [
  { id: "clasico", name: "CLÁSICO",    cost: 0,    body: "#ffb703", dark: "#d98e00", visor: "#1b2a5c", cross: "#3fc1ff", desc: "El Byte de siempre." },
  { id: "neon",    name: "NEÓN ROSA",  cost: 350,  body: "#ff2e88", dark: "#b81d62", visor: "#1a0820", cross: "#ff2e88", desc: "Para brillar en la oscuridad del data center." },
  { id: "artico",  name: "CIAN ÁRTICO", cost: 350, body: "#8fe3ff", dark: "#4fb0d6", visor: "#0b2238", cross: "#ffffff", desc: "Refrigerado por líquido." },
  { id: "toxico",  name: "TÓXICO",     cost: 600,  body: "#7dff3b", dark: "#4fb81d", visor: "#0f2a08", cross: "#b6ff3b", desc: "Un chasis con residuos radiactivos." },
  { id: "carbono", name: "CARBONO",    cost: 800,  body: "#3a3f4b", dark: "#23262e", visor: "#2a0505", cross: "#ff7a1a", desc: "Fibra de carbono táctica." },
  { id: "oro",     name: "ORO ÉLITE",  cost: 1200, body: "#ffd700", dark: "#b8860b", visor: "#1b1300", cross: "#ffd700", desc: "Solo para quienes purgaron muchos sectores." },
  { id: "glitch",  name: "GLITCH",     cost: 2000, anim: true, body: "#ff2e88", dark: "#3fc1ff", visor: "#05050a", cross: "#ffffff", desc: "Color cambiante en tiempo real." },
];
let SK = SKINS[0];
function skinCols(t) {
  const s = SKINS.find(k => k.id === profile.skin) || SKINS[0];
  if (!s.anim) return s;
  const h = (t * 120) % 360;
  return { body: `hsl(${h},90%,60%)`, dark: `hsl(${(h + 40) % 360},90%,38%)`, visor: s.visor, cross: `hsl(${(h + 180) % 360},90%,72%)` };
}

// =====================================================================
//  BIOMAS
// =====================================================================
// Cada capítulo (10 sectores) tiene 5 escenarios (uno cada 2 sectores), su jefe,
// su música y su forma de generar mapas. A partir del capítulo 5 todo se genera de forma procedural.
const CHAPTERS = [
  { name: "El Data Center", boss: 0, gen: { S: 10, rMin: 4, rMax: 7, loop: .3, pillar: .6 }, biomes: [
    { name: "Recepción",          pal: ["#4a5568", "#2d3748", "#718096"], ceil: ["#141826", "#2e3446"], floor: ["#3b3f4c", "#101218"], fog: 14, fogCol: "0,0,0", wall: "panel", pillar: "rack", track: "biome0" },
    { name: "Sala de Servidores", pal: ["#2f5d62", "#1b3a3e", "#5e9ea0"], ceil: ["#081316", "#1d3437"], floor: ["#2a3a3c", "#070d0e"], fog: 12, fogCol: "0,8,10", wall: "panel", pillar: "rack", track: "biome1" },
    { name: "Refrigeración",      pal: ["#4a6b8a", "#2a4560", "#9cc4e8"], ceil: ["#0a1a2a", "#1d3b55"], floor: ["#2a4055", "#081320"], fog: 13, fogCol: "10,25,40", wall: "crystal", pillar: "pipe", track: "biome2" },
    { name: "Fundición de Datos", pal: ["#6b4a2b", "#3a2615", "#b07a48"], ceil: ["#1a0d05", "#3a2010"], floor: ["#3a2a1a", "#0d0805"], fog: 11, fogCol: "25,8,0", wall: "brick", pillar: "pipe", track: "biome3" },
    { name: "El Núcleo",          pal: ["#6b2b2b", "#3a1515", "#a14848"], ceil: ["#140505", "#3a1414"], floor: ["#2d1a1a", "#080303"], fog: 11, fogCol: "20,0,0", wall: "circuit", pillar: "core", track: "biome4" },
  ] },

function drawRadar() {

  ctx.strokeStyle = "#3fc1ff"; ctx.shadowColor = "#3fc1ff"; ctx.shadowBlur = 8; ctx.lineWidth = 1; ctx.stroke(); ctx.shadowBlur = 0; ctx.clip();

function showOv(html, full = false) { ov.innerHTML = html; ov.classList.toggle("full", full); ov.classList.remove("hidden"); bindOv(); }
function hideOv() { ov.classList.add("hidden"); }
const bitsHTML = v => `<span class="bits"><i class="hex"></i>${v} BITS</span>`;
function bindOv() {
  ov.querySelectorAll("[data-vol]").forEach(el => el.oninput = () => {
    audioInit(); profile.music = profile.music || {}; profile.music.vol = el.value / 100; profile.music.on = true; saveProfile();
    ov.querySelectorAll("[data-act=mute]").forEach(b => b.textContent = "SILENCIAR");
  });
  ov.querySelectorAll("[data-act]").forEach(b => b.onclick = ev => {
    ev.stopPropagation(); audioInit(); sfx("ui");
    const [a, x, y] = b.dataset.act.split(":");
    switch (a) {
      case "new": newRun(x); break;
      case "newmenu": showNewMenu(); break;
      case "continue": run = { ...profile.run }; startSector(run.sector); break;
      case "resume": state = "playing"; hideOv(); requestLock(); break;
      case "retry": retrySector(); break;
      case "next": run = { ...profile.run }; startSector(run.sector); break;
      case "title": showTitle(); break;
      case "shop": shopReturn = x || "title"; showShop(x === "inter" ? "arsenal" : shopTab); break;
      case "tab": showShop(x); break;
      case "shopback": shopReturn === "inter" ? showInter() : showTitle(); break;
      case "buy": buy(x, y); break;
      case "equip": profile.skin = x; saveProfile(); sfx("pickup"); showShop("skins"); break;
      case "wsel": wskinW = x; showShop("wskins"); break;
      case "wequip": profile.wskinOf[wskinW] = x; saveProfile(); sfx("pickup"); showShop("wskins"); break;
      case "slot": arsenalSel = +x; showShop("arsenal"); break;
      case "arm": armWeapon(x); break;
      case "unarm": unarmSlot(+x); break;
      case "mute": toggleMusic(); break;
      case "reset": if (confirm("¿Borrar todo el progreso (bits, mejoras, skins y partida)?")) { localStorage.removeItem(PKEY); profile = loadProfile(); showTitle(); } break;
    }
  });
}

       nueva música y un nuevo jefe te espera en el sector ${nch * CAMPAIGN + CAMPAIGN}: <b>${bossFor(nch).name}</b>.</p>`
    : `<div class="logo gold" data-t="SECTOR PURGADO">SECTOR PURGADO</div><p class="sub">${d.name}</p>`;
  showOv(`${head}${d.statsH}
    <div class="row">${bitsHTML(profile.bits)}</div>
    <p class="story">Siguiente: <b>SECTOR ${next}${next % CAMPAIGN === 0 ? ` · JEFE: ${bossFor(chapterOf(next)).name}` : ""} · ${biomeFor(next).name.toUpperCase()}</b>${INTRO[next] ? ` — nueva amenaza: <b>${EDEF[INTRO[next]].name}</b>` : ""}</p>
    <div class="row">
      <button class="btn" data-act="next">▶ ${chDone ? `CAPÍTULO ${nch + 1}` : "CONTINUAR"}</button>
      <button class="btn pink" data-act="shop:inter">MERCADO NEGRO</button>
      <button class="btn ghost" data-act="title">MENÚ</button>
    </div>`);
}

// ---------- Tienda ----------
const SUPPLIES = [
  { id: "ammo", name: "PAQUETE DE MUNICIÓN", cost: 120, desc: "Llena la mitad de cada tipo de munición para el próximo sector.",
    apply: r => { for (const k in AMMO_CAP) r.ammo[k] = Math.max(r.ammo[k] || 0, Math.round(AMMO_CAP[k] / 2)); } },
  { id: "heal", name: "REPARACIÓN COMPLETA", cost: 90, desc: "Empiezas el próximo sector con la integridad al máximo.", apply: r => { r.health = maxHealth(); } },
  { id: "armor", name: "BLINDAJE PESADO", cost: 110, desc: "Empiezas el próximo sector con 100 de blindaje.", apply: r => { r.armor = 100; } },
];
function buy(kind, id) {
  let cost = 0, ok = false;
  if (kind === "w") {
    const w = WEAPONS[WI(id)]; cost = w.shop;
    if (!profile.shopW.includes(id) && profile.bits >= cost) {
      profile.shopW.push(id); ok = true;
      if (profile.run) {
        const r = profile.run; r.slots = r.slots || freshSlots(); const free = r.slots.indexOf(null);
        if (free >= 0) r.slots[free] = id;
        r.ammo.cells = Math.max(r.ammo.cells || 0, 80); r.mag[id] = magSize(w);
      }
    }
  } else if (kind === "u") {
    const u = UPGRADES.find(x => x.id === id), lv = upg(id); cost = u.cost[lv];
    if (lv < u.max && profile.bits >= cost) { profile.up[id] = lv + 1; ok = true; }
  } else if (kind === "s") {
    const s = SKINS.find(x => x.id === id); cost = s.cost;
    if (!profile.skins.includes(id) && profile.bits >= cost) { profile.skins.push(id); profile.skin = id; ok = true; }
  } else if (kind === "ws") {
    const s = WSKINS.find(x => x.id === id); cost = s.cost;
    if (!profile.wskins.includes(id) && profile.bits >= cost) { profile.wskins.push(id); profile.wskinOf[wskinW] = id; ok = true; }
  } else if (kind === "c" && profile.run) {
    const c = SUPPLIES.find(x => x.id === id); cost = c.cost;
    if (profile.bits >= cost) { c.apply(profile.run); ok = true; }
  }
  if (ok) { profile.bits -= cost; saveProfile(); sfx("buy"); } else sfx("deny");
  showShop(shopTab);
}
let arsenalSel = 0, wskinW = "pistol";
function armWeapon(id) {
  const r = profile.run; if (!r) return;
  r.slots = r.slots || freshSlots(); r.stash = r.stash || [];
  const old = r.slots[arsenalSel];
  r.slots[arsenalSel] = id; r.stash = r.stash.filter(x => x !== id);
  if (old && !profile.shopW.includes(old) && !r.stash.includes(old)) r.stash.push(old);
  if (r.mag[id] === undefined) r.mag[id] = magSize(WD[id]);
  if (!r.slots.includes(r.weapon)) r.weapon = id;
  saveProfile(); sfx("weapon"); showShop("arsenal");
}
function unarmSlot(i) {
  const r = profile.run; if (!r) return;
  const old = r.slots[i]; if (!old) return;
  r.slots[i] = null;
  if (!profile.shopW.includes(old) && !r.stash.includes(old)) r.stash.push(old);
  if (r.weapon === old) r.weapon = r.slots.find(Boolean) || "wrench";
  arsenalSel = i; saveProfile(); sfx("ui"); showShop("arsenal");
}
function showShop(tab) {
  state = "shop"; shopTab = tab;
  if (document.pointerLockElement) document.exitPointerLock();
  const B = profile.bits;
  const tabs = [["arsenal", "ARSENAL"], ["armas", "ARMAS EXCLUSIVAS"], ["wskins", "SKINS DE ARMAS"], ["mejoras", "MEJORAS"], ["skins", "SKINS DE BYTE"], ["suministros", "SUMINISTROS"]]
    .map(([k, n]) => `<button class="tab ${k === tab ? "on" : ""}" data-act="tab:${k}">${n}</button>`).join("");
  let body = "";
  if (tab === "armas") {
    body = WEAPONS.filter(w => w.shop).map(w => {
      const own = profile.shopW.includes(w.id);
      return `<div class="item ${own ? "own" : "excl"}">
        <span class="tagx">EXCLUSIVA DEL MERCADO</span>
        <img class="wimg" src="${modelURL(w.id)}" alt="">
        <h4>${w.name}</h4><p>${w.desc}</p>
        <div class="st">Daño <b>${w.dmg[0]}–${w.dmg[1]}</b> · Cargador <b>${w.mag}</b> · Munición <b>celdas${w.per ? " ×" + w.per : ""}</b></div>
        ${own ? `<button class="btn sm ghost" disabled>EN TU ARSENAL</button>` : `<button class="btn sm pink" data-act="buy:w:${w.id}" ${B < w.shop ? "disabled" : ""}>COMPRAR · ${w.shop}</button>`}
      </div>`;
    }).join("");
  } else if (tab === "arsenal") {
    const r = profile.run;
    if (!r) body = `<div class="item"><h4>SIN PARTIDA ACTIVA</h4><p>Empieza una partida para organizar tus 4 ranuras de armas.</p></div>`;
    else {
      const slots = r.slots || freshSlots();
      const avail = [...new Set([...(r.stash || []), ...profile.shopW])].filter(id => WD[id] && !slots.includes(id));
      body = `<div style="grid-column:1/-1" class="hint">Solo puedes llevar <b>4 armas</b> a la vez. Elige una ranura y luego el arma que quieres poner en ella.
        La <b>llave inglesa</b> siempre está disponible con <kbd>V</kbd>. Las armas que cambies en combate se guardan aquí.</div>
        <div style="grid-column:1/-1" class="loadout">${slots.map((id, i) => `
          <div class="slot ${id ? "full" : ""} ${i === arsenalSel ? "sel" : ""}" data-act="slot:${i}">
            <b>RANURA ${i + 1}</b>
            ${id ? `<img class="wimg" src="${modelURL(id)}" alt=""><span>${WD[id].name}</span><button class="btn sm ghost" data-act="unarm:${i}">QUITAR</button>` : `<span>VACÍA</span>`}
          </div>`).join("")}</div>
        <div style="grid-column:1/-1" class="sub">ARMAS DISPONIBLES</div>
        ${avail.length ? avail.map(id => `<div class="item ${profile.shopW.includes(id) ? "excl" : ""}">
          <span class="tagx">${profile.shopW.includes(id) ? "EXCLUSIVA DEL MERCADO" : "ENCONTRADA EN COMBATE"}</span>
          <img class="wimg" src="${modelURL(id)}" alt=""><h4>${WD[id].name}</h4>
          <button class="btn sm alt" data-act="arm:${id}">EQUIPAR EN RANURA ${arsenalSel + 1}</button></div>`).join("")
          : `<div class="item"><h4>NADA EN RESERVA</h4><p>Encuentra armas en los sectores o cómpralas en el mercado.</p></div>`}`;
    }
  } else if (tab === "wskins") {
    const cur = (profile.wskinOf || {})[wskinW] || "estandar";
    body = `<div style="grid-column:1/-1" class="chips">${WEAPONS.map(w => `<button class="chip ${w.id === wskinW ? "on" : ""}" data-act="wsel:${w.id}"><img src="${modelURL(w.id)}" alt="">${w.name}</button>`).join("")}</div>
      <div style="grid-column:1/-1" class="wprev"><img src="${modelURL(wskinW, cur)}" alt="">
        <div class="sub">${WD[wskinW].name}<br>SKIN ACTUAL: <b style="color:var(--yl)">${WSKINS.find(s => s.id === cur).name}</b><br>Pulsa <kbd>I</kbd> en partida para inspeccionarla.</div></div>
      ${WSKINS.map(s => {
        const own = profile.wskins.includes(s.id), eq = cur === s.id;
        return `<div class="item ${eq ? "own" : ""}"><img class="wimg" src="${modelURL(wskinW, s.id)}" alt=""><h4>${s.name}</h4><p>${s.desc}</p>
          ${eq ? `<button class="btn sm ghost" disabled>EQUIPADA</button>` : own ? `<button class="btn sm alt" data-act="wequip:${s.id}">EQUIPAR</button>` :
            `<button class="btn sm" data-act="buy:ws:${s.id}" ${B < s.cost ? "disabled" : ""}>COMPRAR · ${s.cost}</button>`}</div>`;
      }).join("")}`;
  } else if (tab === "mejoras") {
    body = UPGRADES.map(u => {
      const lv = upg(u.id), maxed = lv >= u.max, cost = u.cost[lv];
      return `<div class="item ${maxed ? "own" : ""}"><h4>${u.name}</h4>
        <div class="pips">${Array.from({ length: u.max }, (_, i) => `<i class="pip ${i < lv ? "on" : ""}"></i>`).join("")}</div>
        <p>${u.desc}</p>
        ${maxed ? `<button class="btn sm ghost" disabled>NIVEL MÁXIMO</button>` : `<button class="btn sm alt" data-act="buy:u:${u.id}" ${B < cost ? "disabled" : ""}>MEJORAR · ${cost}</button>`}
      </div>`;
    }).join("");
  } else if (tab === "skins") {
    body = SKINS.map(s => {
      const own = profile.skins.includes(s.id), eq = profile.skin === s.id;
      return `<div class="item ${eq ? "own" : ""}">
        <div class="skinprev ${s.anim ? "anim" : ""}" style="--b:${s.body};--d:${s.dark};--v:${s.visor}"></div>
        <h4>${s.name}</h4><p>${s.desc}</p>
        ${eq ? `<button class="btn sm ghost" disabled>EQUIPADA</button>` : own ? `<button class="btn sm alt" data-act="equip:${s.id}">EQUIPAR</button>` :
          `<button class="btn sm" data-act="buy:s:${s.id}" ${B < s.cost ? "disabled" : ""}>COMPRAR · ${s.cost}</button>`}
      </div>`;
    }).join("");
  } else {
    body = profile.run ? SUPPLIES.map(c => `<div class="item"><h4>${c.name}</h4><p>${c.desc}</p>
      <button class="btn sm" data-act="buy:c:${c.id}" ${B < c.cost ? "disabled" : ""}>COMPRAR · ${c.cost}</button></div>`).join("")
      : `<div class="item"><h4>SIN PARTIDA ACTIVA</h4><p>Los suministros se aplican al próximo sector de una partida en curso.</p></div>`;
  }
  showOv(`<div class="shop">
    <div class="shop-head"><h2>MERCADO NEGRO</h2>${bitsHTML(B)}<button class="btn ghost sm" data-act="shopback">← VOLVER</button></div>
    <div class="tabs">${tabs}</div>
    <div class="grid">${body}</div></div>`, true);
}

// =====================================================================
//  ENTRADA
// =====================================================================
function requestLock() { try { const r = cv.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
document.addEventListener("pointerlockchange", () => {
  const was = locked; locked = document.pointerLockElement === cv;
  if (was && !locked && state === "playing") { state = "paused"; input.fire = false; showPause(); }
});
cv.addEventListener("mousedown", e => { audioInit(); if (state !== "playing") return; if (!locked) requestLock(); if (e.button === 0) input.fire = true; });
window.addEventListener("mouseup", e => { if (e.button === 0) input.fire = false; });
window.addEventListener("mousemove", e => { if (locked && state === "playing") input.mouseDX += e.movementX; });
window.addEventListener("wheel", e => {
  if (state !== "playing") return;
  const dir = e.deltaY > 0 ? 1 : -1, cur = Math.max(0, player.slots.indexOf(player.weapon));
  for (let k = 1; k <= MAX_SLOTS; k++) { const i = (cur + dir * k + MAX_SLOTS * 2) % MAX_SLOTS, id = player.slots[i]; if (id && hasAmmo(WD[id])) { selectSlot(i); break; } }
}, { passive: true });
window.addEventListener("keydown", e => {
  if (["Space", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  input.keys[e.code] = true;
  if (state === "playing") {
    if ((e.code === "KeyE" || e.code === "Space") && !e.repeat) useAction();
    if (e.code === "KeyR" && !e.repeat) startReload();
    if (e.code === "Tab" && !e.repeat) showMap = !showMap;
    if (/^Digit[1-4]$/.test(e.code)) selectSlot(+e.code.slice(5) - 1);
    if (e.code === "KeyV" && !e.repeat) selectMelee();
    if (e.code === "KeyI" && !e.repeat && player.reloadT <= 0 && player.raise < .3) player.inspectT = player.inspectT > 0 ? 0 : INSPECT_T;
    if (e.code === "Escape" && !locked) { state = "paused"; showPause(); }
  } else if (state === "paused" && e.code === "Escape" && !e.repeat) { state = "playing"; hideOv(); requestLock(); }
});
window.addEventListener("keyup", e => { input.keys[e.code] = false; });
// Los navegadores solo permiten sonido tras una interacción: la primera tecla o clic arranca la música
window.addEventListener("pointerdown", audioInit);
window.addEventListener("keydown", e => { audioInit(); if (e.code === "KeyM" && !e.repeat) toggleMusic(); });
window.addEventListener("blur", () => { input.keys = {}; input.fire = false; });

// =====================================================================
//  BUCLE PRINCIPAL
// =====================================================================
let last = performance.now();
function frame(t) {
  const dt = Math.min((t - last) / 1000, .05); last = t;
  if (state === "playing") update(dt);
  else if (state === "dead") { hurtFlash = Math.max(.3, hurtFlash - dt); updateProjectiles(dt); tickFx(dt); }
  else if (state === "title" || state === "shop") { player.a += dt * .18; stats.time += dt; for (const e of enemies) e.anim += dt * .5; }
  musicUpdate(dt);
  if (L) render(state !== "title" && state !== "shop");
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
